name: IT School checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: it_school
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: it_school_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U it_school -d it_school_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Test API against isolated PostgreSQL
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: it_school
          DB_PASSWORD: disposable-ci-password
          DB_NAME: it_school_test
        run: node test/api.mjs
