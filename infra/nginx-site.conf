# Install as /etc/nginx/sites-available/it-school and enable its symlink.
# This configuration expects an existing certificate for the public domain.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name telegrambot.vps.webdock.cloud;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 302 https://telegrambot.vps.webdock.cloud/it-school/; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name telegrambot.vps.webdock.cloud;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/telegrambot.vps.webdock.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telegrambot.vps.webdock.cloud/privkey.pem;
    include /etc/nginx/snippets/it-school.conf;
    location = / { return 302 /it-school/; }
    location / { return 404; }
}
